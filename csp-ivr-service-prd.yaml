# ============================================================================
# Section 19 — Notification Service Integration (outbound for PN/SMS/WA)
# ============================================================================
notification_integration:

  architectural_principle: |
    csp-ivr-service is responsible for DETECTING that a call was missed; it is
    NOT responsible for deciding HOW the missed party is notified (push vs SMS
    vs WhatsApp vs in-app banner) or for calling channel-specific providers.
    All channel routing is owned by csp-notification-service, which consumes
    `ES_CSPIVR_MISSED_CALL_DETECTED` from the event bus.

  ivr_outbound_contract:
    event: "ES_CSPIVR_MISSED_CALL_DETECTED (see §6 events.produces for full payload)"
    bus_topic: "csp.ivr.missed-call"
    delivery: "At-least-once via transactional outbox. IVR commits the call_audit_logs row + the outbox row in one DB transaction; a separate worker drains the outbox to the bus."

  notification_service_consumer_contract:
    consumer: "csp-notification-service"
    routing_logic_owned_by_consumer:
      - "Look up the missed_party_id's device registry → choose PN channel (FCM for native push, CleverTap for campaign push) or fall back to SMS/WA if no active device."
      - "Look up missed_party_id's notification preferences (PN opt-in, SMS opt-in, language)."
      - "Choose template per ticket_type + missed_party_type + language (Hindi-first)."
      - "Fire the channel-specific delivery (CleverTap event with campaign mapping, Gupshup SMS, BSP WhatsApp)."
      - "Record delivery receipts back to its own audit log."
    deep_link: "Notification service uses the `callback_deeplink` field on the event payload as the tap target on the PN."

  missed_call_notification_doubles_as_pin_reminder:
    use_case: |
      Every missed-call notification (PN / SMS / WA) carries the **missed
      party's own PIN** so they can call back from any SIM and bridge
      through to the other party — even from an unregistered phone.

      Critical scenarios this unlocks:
      - **UC 11 fallback**: Customer is on a relative's phone when the
        CSP calls. Customer misses it. Notification arrives on customer's
        registered mobile (SMS/WA — they don't need to be in-app). When
        they dial the masked number from any phone, they enter the PIN
        from the notification → bridge.
      - **UC 12 fallback**: CSP missed a customer call. CSP App push
        notification includes the CSP-side PIN. When the CSP calls back
        from a non-inventoried SIM (forgot to register a new phone), the
        PIN in the PN gets them through.
      - **UC 09 / UC 10 (recognised callback)**: Even when the missed
        party calls back from their registered mobile, the PIN reminder
        is useful if Table 1 has expired — they have the PIN handy if
        IVR prompts for one (multi-ticket case).

    privacy_note: "The PIN embedded in the notification is the recipient's OWN PIN — already in their possession from ticket-open. The notification is a convenience reminder, not new disclosure."

    template_treatment:
      pn: "PN body shows 'Tap to call back' (deep-link) + PIN displayed prominently in case the user dials from a different phone."
      sms_wa: "Template line: '<Caller> tried to reach you about your <ticket_type>. Call <masked_number> and enter PIN <pin> to connect.'"

  channels_currently_planned_by_notification_service:
    - channel: "Push Notification (CSP App)"
      when: "missed_party_type = csp AND CSP App active install present"
      delivery: "Via FCM (or CleverTap PN — Notification service's choice)"
      copy_template: "Hindi-first, includes caller name + ticket_type + tap-to-callback + PIN reminder"
    - channel: "Push Notification (Customer App)"
      when: "missed_party_type = customer AND Customer App active install present"
      delivery: "Via FCM (or CleverTap PN)"
      copy_template: "Same — PIN reminder included"
    - channel: "SMS (DLT-templated)"
      when: "Fallback when PN delivery fails OR no active app install (most customers)"
      delivery: "Via Gupshup with 'Wiom' sender ID"
      copy_template: "Includes PIN — primary channel for customers without app"
    - channel: "WhatsApp"
      when: "Customer's WA opted-in"
      delivery: "Via BSP with approved templates"
      copy_template: "Includes PIN"

  why_ivr_doesnt_fire_clevertap_directly:
    rationale: |
      In an earlier draft, IVR fired CleverTap events directly from the
      Passthru-Async-on-DNP hop. This was rejected because:
      1. Conflates IVR (a routing capability) with notification policy
         (channel preferences, copy templates, recipient preferences, delivery
         receipts).
      2. Locks the notification stack to CleverTap. Future PN providers
         (FCM-native, OneSignal, etc.) would require IVR changes.
      3. Duplicates concerns: csp-notification-service already exists to own
         multi-channel routing for every event-driven notification in Wiom.
      Cleanest contract: IVR emits a domain event with all the data the
      Notification service needs; routing decisions live in one place.

  what_ivr_still_owns_directly:
    - "Dead-end SMS — sent inline from the Passthru applet that hits the dead-end (NOT via Notification service). Rationale: dead-end SMS is part of the IVR's own graceful-fallback contract, fires within the call session, and shouldn't depend on an async notification consumer being healthy. Open TBD: should this also migrate to Notification service v2 once it supports synchronous SMS dispatch?"
    - "PIN delivery SMS / WA at ticket-open — sent inline by IVR's listener (see §17 PIN lifecycle distribution). Same rationale: tightly coupled to PIN generation; Notification service v1 doesn't yet model 'credential delivery' as a use case."

# ============================================================================
# Section 20 — Comms-Layer Dependencies
# ============================================================================
comms_layer_dependencies:
  outbound_sms_must_use:
    - "DLT-registered templates with 'Wiom' sender ID (not generic 11444XXXX)."
  outbound_whatsapp_must_use:
    - "WhatsApp BSP with approved templates."
  default_language: "Hindi (voice-first Bharat user)."
  language_expansion: "Per CSP geography post-Hindi. Solution-team owned."

  trust_layers:
    - layer: "Truecaller whitelisting"
      effect: "Green verified banner with Wiom name (most Bharat users have Truecaller installed)."
    - layer: "VLT (Verified Logo Trustmark)"
      effect: "Telco-level verified-business-caller flag, complementary to Truecaller."

  messages_to_ship_before_launch:
    - "Ticket-open SMS / WhatsApp to customer (masked number + customer-side PIN + dial instruction)."
    - "Missed-call alert SMS / WhatsApp (CSP-side and customer-side variants)."
    - "Dead-end SMS to caller's FROM (call centre or trust line variant)."
    - "IVR voice prompts (PIN entry, dead-end call-centre, dead-end trust-line)."

# ============================================================================
# Section 21 — Use Cases (13)
# ============================================================================
use_cases:
  identified_app:
    - id: UC_01
      name: "CSP dials from CSP App via registered SIM"
      path: Path_1 (Table 1 hit)
      expected: "Bridge directly. No PIN."
    - id: UC_02
      name: "Customer dials from Customer App via registered SIM"
      path: Path_1

  identified_dialer_csp:
    - id: UC_03
      name: "CSP dials previously-used masked number — single active ticket"
      path: Path_2 (Table 2 by-FROM = 1)
    - id: UC_04
      name: "CSP dials masked number — multi-ticket"
      path: Path_3 (Table 2 by-FROM ≥ 2 → PIN prompt)
    - id: UC_05
      name: "CSP callback on customer-initiated MN — single ticket"
      path: Path_2
    - id: UC_06
      name: "CSP callback on customer-initiated MN — multi-ticket"
      path: Path_3

  identified_dialer_customer:
    - id: UC_07
      name: "Customer dials masked number — single ticket (~99%)"
      path: Path_2
    - id: UC_08
      name: "Customer dials masked number — multi-ticket (~1%)"
      path: Path_3
    - id: UC_09
      name: "Customer callback after CSP missed-call — single ticket"
      path: Path_2
    - id: UC_10
      name: "Customer callback after CSP missed-call — multi-ticket"
      path: Path_3

  not_identified:
    - id: UC_11
      name: "Customer dials from unregistered SIM (relative's phone, secondary SIM)"
      path: Path_4 (Unknown FROM → PIN prompt)
    - id: UC_12
      name: "CSP dials from unregistered SIM (not in sim_inventory)"
      path: Path_4
    - id: UC_13
      name: "CSP forwards masked number to colleague (colleague's phone unregistered)"
      path: Path_4
      implementation_note: "PIN must be visible on ticket-card screenshot. UI requirement."

  edge_cases_not_standalone:
    - case: "Recognised user, 0 active tickets (e.g., closed-ticket customer dialling back) → skip PIN entirely → dead-end IVR."
    - case: "2 wrong PIN attempts on Path 3 or Path 4 → dead-end IVR with user_type-based helpline."

# ============================================================================
# Section 22 — Design Decisions
# ============================================================================
design_decisions:
  - decision: "Single bidirectional masked number (not MN1/MN2)"
    rationale: "Removes wrong-direction-dial failure (today CSPs see MN1 in call log, try to dial back, drops because MN1 is one-way)."

  - decision: "Table 2 by-FROM is the primary lookup at Table 1 miss"
    rationale: "Table 2 encodes everything: caller identity (via JOIN with sim_inventory + identity tables) AND counterparty (other_party_mobile on the row). Single resolution returns 0/1/many → branches the entire flow. user_identification API ONLY fires when Table 2 by-FROM = 0."

  - decision: "Single ivr-routing-service owns the entire system"
    rationale: "Tables 1+2, sim_inventory, user_identification, Exotel surface, ES listener, SMS dispatch, CleverTap firing, maskedCallAvailable derivation. Avoids cross-service latency on the hot path. One team, one DB, one deployment."

  - decision: "Discard legacy es-ivr-calling-service; build sim_inventory fresh"
    rationale: "Existing service was a thin wrapper around the IVR microservice with no audit logging. Starting fresh gives proper add/remove audit, consistent ownership, removes integration ambiguity."

  - decision: "API 2 returns 5-value composite discriminator (not just user_type)"
    rationale: |
      The Switch Case at the post-Connect-empty-destination hop must distinguish 4 outcomes for recognised callers: (no active ticket × customer/csp = dead-end) and (≥ 2 active tickets × customer/csp = PIN gather). A 3-value user_type would collapse these and send recognised multi-ticket callers to the wrong dead-end. Composite values encode both signals in one applet hop; API 1 already stashes both against CallSid.
    alternative_rejected: "Extra Passthru after Switch Case to check ticket-count — adds ~200-300 ms per affected call."

  - decision: "Unknown FROM routes to PIN gather (not direct to dead-end)"
    rationale: "Critical for UC 13 (colleague forwarding) — colleague isn't recognised but holds a forwarded PIN. Giving up immediately on unknown FROM would block this case."

  - decision: "Two PINs per ticket (customer-side + CSP-side)"
    rationale: "Symmetric authorisation; either party can authenticate when off-CTA. PIN encodes ticket + direction."

  - decision: "Customer-side PIN via SMS; CSP-side via app ticket card only"
    rationale: "Customers are not app-engaged; SMS reaches them. CSPs see ticket details in app — no SMS noise."

  - decision: "5-digit PIN, random with uniqueness retry"
    rationale: "100K combos × 2-attempt cap = 0.002% brute-force probability per call. Sized against today's ~65K used of 100K pool."

  - decision: "PIN is immutable for row lifetime — no rotation, ever"
    rationale: "PIN is shared with both parties at ticket-open. Rotating invalidates what they hold and forces re-distribution. PIN is already short, scoped, and 2-attempt-capped."

  - decision: "Reassignment rewrites mobile only, leaves PIN untouched"
    rationale: "Both parties keep PINs they already have. Only bridge target (other_party_mobile) changes underneath. Avoids 'which PIN is current' failure mode."

  - decision: "PIN cooldown after ticket close (90 days)"
    rationale: "Closed-ticket PIN reserved (excluded from generation pool) for 90 days. Protects against stale-PIN cross-pollination."

  - decision: "PIN scoping for CSPs (sim_inventory match → restricted lookup)"
    rationale: "Prevents one CSP from guessing/reaching another CSP's customer. Backstop on stale-PIN risk on CSP side."

  - decision: "2-attempt cap per call"
    rationale: "App Bazaar flow constraint — more retries doubles applet count per attempt. Brute-force at 2 attempts × 100K = 0.002%."

  - decision: "Dead-end ALSO sends SMS, not just voice"
    rationale: "Voice ephemeral; SMS lets the caller act later."

  - decision: "One bidirectional DID, not a pool"
    rationale: "Truecaller + VLT verification applied to one number. No pool-picking algorithm."

  - decision: "Truecaller whitelisting reuses one of MN1/MN2"
    rationale: "No fresh whitelisting work; verified status carries forward. The other number eventually decommissioned."

  - decision: "Missed-call alerts via CleverTap campaigns"
    rationale: "Reuses Wiom's existing campaign infrastructure."

  - decision: "Hindi as default IVR language"
    rationale: "Voice-first Bharat user. English IVR is a hard blocker."

  - decision: "Missed-call alerts fire from Passthru-Async-on-DNP, NOT from disposition webhook"
    rationale: "DNP detected within seconds at Passthru; disposition arrives after end-of-call (variable lag). Single source of truth avoids duplicates or requires CallSid dedup."

  - decision: "IVR emits ES_CSPIVR_MISSED_CALL_DETECTED to event bus; csp-notification-service owns channel routing (PN / SMS / WA)"
    rationale: |
      IVR is a routing capability, not a notification policy engine. Letting
      Notification service own channel selection means: (a) channel preferences,
      copy templates, language routing, and provider migrations all live in
      one place; (b) IVR doesn't need to know which users have which apps
      installed; (c) future PN providers (FCM-native, OneSignal) don't require
      IVR changes. Transactional outbox ensures at-least-once delivery so a
      Notification service blip never loses a missed-call alert.

  - decision: "Missed-call notification carries the missed party's own PIN — doubles as a bridging-credential reminder"
    rationale: |
      The PIN-in-notification enables the recipient to call back from ANY
      SIM (not just their registered mobile) and bridge through to the
      other party. Without this, a customer who missed the CSP's call from
      a relative's phone would be stuck at the IVR Gather prompt with no
      way to recall their PIN. The PIN is the recipient's own (they
      received it at ticket-open) — embedding it in the reminder is a
      convenience, not new disclosure. Notification service templates
      include the PIN inline (PN body, SMS body, WA body).

  - decision: "Calling eligibility scoped to Install / Restore / Pickup tickets"
    rationale: "No calling on closed or pre-booking tickets. Aligns routing surface with operational reality."

  - decision: "Table 2 entry on CANDIDATE_CREATION event with OWNING CSP (Owner) as default executor — NOT on technician assignment"
    rationale: |
      Earlier draft tied allocation to *_TECHNICIAN_ASSIGNED. That was wrong:
      (a) Restore today allows customer↔CSP calling from PENDING_ACCEPTANCE
          (before any technician is assigned) — the customer needs to be able
          to reach the Owner to discuss the complaint.
      (b) The Owner can also choose to work the ticket themselves without
          delegating (Restore IN_PROGRESS via START_WORK; Install
          is_self_assigned=true). PIN must exist in this self-execute path.
      (c) NBREC already had this right — ES_NBREC_RECOVERY_TASK_ASSIGNED at
          candidate creation IS the allocation trigger.
      Universal pattern: allocate at candidate creation with Owner as default;
      technician assignment is a mobile-only UPDATE (re-points the customer-
      side bridge target); recall reverts to Owner. PIN never rotates.
    impact_on_call_routing:
      pre_technician_assignment: "Customer-initiated call → bridges to OWNER."
      post_technician_assignment: "Customer-initiated call → bridges to TECHNICIAN."
      on_recall: "Customer-initiated call → bridges back to OWNER."
      install_is_self_assigned_true: "Customer-initiated call → bridges to OWNER (who is also the technician)."

  - decision: "Table 2 exit on ES terminal-state transition, not on a generic ticket_close facade"
    rationale: "Each of the 3 ESs has its own terminal states. Subscribing family-specific terminal events keeps Table 2 in lockstep with ES state machines."

# ============================================================================
# Section 23 — Trade-offs Accepted
# ============================================================================
tradeoffs_accepted:
  - tradeoff: "Customer callback from dialer now requires a PIN in multi-ticket case"
    accepted_because: "Customer has the PIN via SMS from ticket-open. The friction is one IVR step."

  - tradeoff: "PIN possession = authorisation, regardless of who holds it (UC 13 colleague forwarding)"
    accepted_because: "Usability ↔ security trade-off — colleague case is a real CSP workflow."

  - tradeoff: "Customer-side PIN lookup is unscoped (no equivalent to CSP sim_inventory scoping)"
    accepted_because: "2-attempt cap + per-ticket PIN + 100K PIN space = acceptable risk. Scoping would require identifying the customer, which would re-introduce a Resolve-FROM step."

  - tradeoff: "Immutable PIN means a leaked PIN stays leaked for ticket's lifetime"
    accepted_because: "Blast radius is one ticket × one direction. PIN possession = authorisation by design (UC 13 requires this). For very long tickets, ES terminal events will close them and cooldown takes over."

  - tradeoff: "PIN pool finite (100K) — cooldown reservation can pressure pool at scale"
    accepted_because: "Today: ~65K of 100K used. At ~3× growth, escalate to 6-digit PINs (1M pool). Generation alerts at retry threshold."

  - tradeoff: "Table 2 by-FROM JOIN cost on every Table-1-miss call"
    accepted_because: "Indexed lookup. Target p95 < 50 ms on JOIN; well within Exotel's 5s. Cache user_type against CallSid for downstream applet reuse."

  - tradeoff: "Skip-Gather depends on Exotel supporting `action: playback` in Connect-applet response"
    accepted_because: "If unsupported, fallback is a Passthru applet between Connect-1 and Gather. Confirm with Exotel before locking."

  - tradeoff: "Listener lag on reassignment can leave Table 2 with old mobile briefly"
    accepted_because: "Sub-30s window typically. Mitigated by at-least-once outbox + idempotent upsert. Acceptable for a routing capability."

# ============================================================================
# Section 24 — Deferred / Future Work
# ============================================================================
deferred_work:
  - item: "PIN reminder SMS on prompt abandonment"
    deferred_because: "Can't determine which PIN to resend mid-call when CSP has multiple tickets, or when caller is unrecognised."

  - item: "6-digit PIN escalation (1M pool)"
    deferred_until: "Generation algorithm's average retry count exceeds threshold OR active+cooldown reservation approaches 70% of pool. Expect ~3× current Wiom volume."
    migration_strategy: "Add new column, generate 6-digit for new rows, leave existing 5-digit rows alone (they expire naturally)."

  - item: "PIN expiry notification at ticket close"
    deferred_because: "Not blocking. Add later if dead-end IVR traffic shows confused customers."

  - item: "Auto-recognition of repeat unknown-SIM callers (Table 4 idea)"
    deferred_because: "Would add an audit step before PIN that costs UX. Revisit with response-pattern data."

  - item: "Per-FROM rate limiting (beyond per-call 2-attempt cap)"
    deferred_because: "Not needed for v1; brute-force economics are bad enough without it."

  - item: "Regional-language IVR expansion (post-Hindi)"
    deferred_because: "Hindi first. Add per CSP geography in a follow-up."

  - item: "WhatsApp BSP-fallback for SMS-undeliverable customers"
    deferred_because: "Operational concern, handled by comms platform."

  - item: "IVR option to actively transfer caller to support ('press 1 to connect')"
    deferred_because: "Today's dead-end gives a number to call but doesn't auto-connect. Could add later."

  - item: "Branched dead-end Playbacks (separate applets per user_type) if dynamic audio URL unsupported"
    deferred_because: "v1 falls back to a universal message if Playback can't take a dynamic URL."

