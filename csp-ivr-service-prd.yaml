# ============================================================================
# Section 29 — Engineering Assumptions
# ============================================================================
engineering_assumptions:
  - "Exotel Connect applet honours `action: playback` in dynamic-URL response (Skip-Gather mechanism for 0-tickets dead-end). If unsupported: fallback Passthru adds one applet hop."
  - "Exotel Playback applet supports dynamic audio URL. If unsupported: v1 ships a universal dead-end greeting."
  - "Exotel egress IP range is published and stable enough for IP allowlist as v1 auth. HMAC pending Exotel confirmation."
  - "Gupshup DLT templates can be registered with 'Wiom' sender ID by launch."
  - "WhatsApp BSP setup with approved templates available by launch."
  - "Truecaller + VLT whitelisting can be reused from one of today's MN1/MN2 numbers without fresh verification."
  - "es-installation-service / es-restore / es-netbox-recovery deliver events via at-least-once outbox → idempotent upsert on (ticket_id, side) handles redelivery."
  - "Owner-mobile resolution is done via csp-gateway-service against the `csp_users` table — filtered by `csp_id` + `role = 'owner'`. The gateway exposes an internal endpoint (e.g., `GET /api/internal/csp-users?csp_id={id}&role=owner`) that returns the Owner row, from which csp-ivr-service reads `csp_user_id` + `registered_mobile`. Called once at candidate-creation time and the resolved mobile is persisted into customer-side row.other_party_mobile."
  - "Each CSP organisation has exactly one Owner (the partner account holder) whose registered_mobile is the canonical pre-assignment routing target."
  - "Customer SMS delivery is reliable enough that PIN reaches the customer before the call is needed. WA + push reminders mitigate failure."
  - "Backend p95 < 200 ms on resolve-caller / resolve-pin within Exotel's 5s budget."
  - "Redis (or equivalent) is available with sub-ms reads for the CallSid → user_type cache."

