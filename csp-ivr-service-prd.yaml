# ============================================================================
# Section 26 — Glossary
# ============================================================================
glossary:
  Recognised: "Caller's number is in Table 1 OR matches a row in Table 2 (directly by FROM or via a valid PIN)."
  Authorised: "Connection is legitimate — PIN entered (or FROM matched) belongs to an active ticket for the party being reached."
  Seamless: "Call connects without the user opening an app, navigating UI, or understanding masked numbers."
  Graceful_fallback: "Unrecognised or unauthorised caller knows why the call didn't connect and has a clear next step (voice + SMS)."
  Masked_number: "Virtual phone number provisioned by Exotel routing via dynamic backend lookup; replaces direct CSP↔customer number exchange."
  MN1_MN2: "Today's two-masked-number scheme (Customer→CSP and CSP→Customer). To be retired."
  CSP: "Connection Service Provider — Wiom's field partner."
  PIN: "5-digit numeric credential, issued per ticket per side, used as fallback authorisation when FROM isn't recognised."
  Table_1: "Active call mapping (FROM → TO), short-lived. Hit = recognised + seamless bridge."
  Table_2: "PIN registry (PIN → other_party_mobile), per-ticket × per-side. Three access patterns: by FROM, by PIN, by (ticket_id, side)."
  user_identification: "API called on Table 2 by-FROM = 0. Returns user_type + (combined with API 1's cached row count) the 5-value composite discriminator for Switch Case."
  Dead_end_IVR: "Terminal voice message when authorisation fails. Routes to call centre (recognised customer) or trust line (everyone else)."
  Calling_eligibility: "Calls only enabled on active Install / Restore / Pickup tickets."
  DNP: "Did-Not-Pick. Recipient sees the call but doesn't answer."
  DLT: "India's regulatory framework for transactional SMS. Templates must be pre-registered."
  VLT: "Verified Logo Trustmark — telco-level verified-business-caller flag."
  BSP: "Business Solution Provider — for WhatsApp Business API."
  TAS: "Task Aggregation Service — NOT integrated with csp-ivr-service (this is a capability service, not a candidate-producer)."

